[project]
name = "agentsentinel"
version = "1.0.0"
description = "Enterprise-grade LLM agent evaluation harness and policy guardrail framework"
readme = "README.md"
authors = [
    { name = "Sudeepkarthik30", email = "thirkarthik30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.3.1",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
agentsentinel = "agentsentinel:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
